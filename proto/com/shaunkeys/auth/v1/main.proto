syntax = "proto3";
package com.shaunkeys.auth.v1;

// Provides APIs for authenticating users.
//
// Example: SSH authentication
// GetAuthPermit({}) -> {permit: "<jwt>"}
// CheckSSHKey({permit: "<jwt>", fingerprint: "<key_1_fprint>"}) -> {recognized: false}
// CheckSSHKey({permit: "<jwt>", fingerprint: "<key_2_fprint>"}) -> {recognized: true}
// ExchangeSSHPermit({
//     permit: "<jwt>",
//     fingerprint: "<key_2_fprint>",
//     format: "id_ecdsa",
//     signature: b"<signed_permit_in_wire_format>",
// }) -> {token: "<jwt_for_api>"}
service AuthService {
  // Gets an authentication permit for use with asymmetric cryptographic functions
  rpc GetAuthPermit(GetAuthPermitRequest) returns (GetAuthPermitResponse);
  // Checks if an SSH key is allowed for authorization
  rpc CheckSSHKey(CheckSSHKeyRequest) returns (CheckSSHKeyResponse);
  // Submits an auth permit signed with an SSH key and exchanges it for an authorization token
  rpc ExchangeSSHPermit(ExchangeSSHPermitRequest) returns (ExchangeSSHPermitResponse);
}

message GetAuthPermitRequest {}
message GetAuthPermitResponse {
  string permit = 1;
}

message CheckSSHKeyRequest {
  string permit = 1;
  string fingerprint = 2;
}
message CheckSSHKeyResponse {
  bool recognized = 1;
}

message ExchangeSSHPermitRequest {
  string permit = 1;
  string fingerprint = 2;
  string format = 3;
  bytes signature = 4;
}
message ExchangeSSHPermitResponse {
  string token = 1;
}
