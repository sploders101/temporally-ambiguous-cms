<!DOCTYPE html>
<html class="{{.DailyTheme}} eye-candy">
  <head>
    <title>{{.Config.SiteSettings.ShortTitle}} - Profile</title>
    {{ template "globalhead" . }}
    <meta name="description" content="Manage your profile" />
  </head>
  <body class="flex column nowrap center">
    <div class="contentbox-container margin-auto">
      <div class="contentbox-double-borders contentbox-decoration-anchor">
        <div class="contentbox-innerwindow">
          <div class="window-decorations">
            <div class="spacer"></div>
            <img
              class="window-decoration"
              src="/decorations/minimize.svg?color=FFFFFF"
            />
            <img
              class="window-decoration"
              src="/decorations/maximize.svg?color=FFFFFF"
            />
            <img
              class="window-decoration"
              src="/decorations/close.svg?color=FFFFFF"
            />
          </div>
          {{ template "nav" . }}
          <main>
              <div class="flex column nowrap f-grow f-align-start gap-1">
                <h1>Change Password</h1>
                <form
                  action="#"
                  method="POST"
                  class="flex column wrap gap-half"
                >
                  {{.CsrfField}}
                  <div class="fieldbox">
                    <label for="oldpass">Old Password:</label>
                    <div class="textbox-wrapper">
                      <input
                        id="oldpass"
                        type="password"
                        name="oldpass"
                        autocomplete="off"
                        spellcheck="false"
                      />
                    </div>
                  </div>
                  <div class="fieldbox">
                    <label for="newpass">New Password:</label>
                    <div class="textbox-wrapper">
                      <input
                        id="newpass"
                        type="password"
                        name="newpass"
                        autocomplete="off"
                        spellcheck="false"
                      />
                    </div>
                  </div>
                  <div class="fieldbox">
                    <label for="newpass">New Password (confirm):</label>
                    <div class="textbox-wrapper">
                      <input
                        id="newpassconfirm"
                        type="password"
                        name="newpassconfirm"
                        autocomplete="off"
                        spellcheck="false"
                      />
                    </div>
                  </div>
                  <input type="submit" value="Add Key" />
                </form>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
